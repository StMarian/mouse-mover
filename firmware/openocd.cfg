# ST-Link V2 -> STM32F103C8T6 over SWD

source [find interface/stlink.cfg]
transport select hla_swd

# Must be set before the target script is sourced. The C8 is specified as 64 KB
# (many chips carry 128 KB, but the upper half is not guaranteed). Matches STM32F103XX_FLASH.ld.
set FLASH_SIZE 0x10000

source [find target/stm32f1x.cfg]

adapter speed 1000
